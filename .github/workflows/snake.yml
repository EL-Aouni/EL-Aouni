name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: EL-Aouni
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - uses: actions/upload-artifact@v4
        with:
          name: github-contribution-grid-snake
          path: dist/snake*.svg

      - name: push snake output to repo root
        run: |
          cp dist/snake.svg ./snake.svg
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snake.svg
          git diff --staged --quiet || git commit -m "chore: update contribution snake"
          git push
